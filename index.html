<!DOCTYPE html>
<html lang="kmr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman IPTV Player - چاککراو</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: #0f0f0f; color: #fff; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { 
            width: 380px; 
            background: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid #333; 
        }
        .header { 
            padding: 20px; 
            background: linear-gradient(135deg, #00bcd4, #008ba3); 
            font-size: 20px; 
            font-weight: bold; 
            text-align: center; 
            color: #fff; 
            box-shadow: 0 2px 10px rgba(0,188,212,0.3);
        }
        
        /* Controls */
        .controls { padding: 15px; background: #222; border-bottom: 1px solid #333; }
        #groupSelect, #searchInput { 
            width: 100%; 
            margin-bottom: 10px; 
            padding: 10px; 
            background: #333; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 6px; 
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        #groupSelect:focus, #searchInput:focus { border-color: #00bcd4; }
        #searchInput { margin-bottom: 0; }
        
        /* Stats */
        .stats { 
            padding: 8px 15px; 
            background: #1e1e1e; 
            color: #888; 
            font-size: 12px; 
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
        }
        
        /* Channel List */
        #channelList { 
            flex: 1; 
            overflow-y: auto; 
            list-style: none; 
            padding: 0; 
        }
        #channelList::-webkit-scrollbar { width: 6px; }
        #channelList::-webkit-scrollbar-track { background: #1a1a1a; }
        #channelList::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        #channelList::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .channel-item { 
            display: flex; 
            align-items: center; 
            padding: 12px 15px; 
            border-bottom: 1px solid #2a2a2a; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .channel-item:hover { background: #2a2a2a; transform: translateX(3px); }
        .channel-item.active { background: #00bcd4; color: #000; }
        .channel-item.active .channel-group { color: #333; }
        
        .channel-item img { 
            width: 45px; 
            height: 45px; 
            object-fit: contain; 
            margin-right: 12px; 
            background: #000; 
            border-radius: 6px; 
            border: 1px solid #333;
        }
        .channel-info { flex: 1; min-width: 0; }
        .channel-name { 
            font-size: 14px; 
            font-weight: 500;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            display: block;
        }
        .channel-group { 
            font-size: 11px; 
            color: #888; 
            margin-top: 2px;
        }
        
        /* Loading */
        .loading { 
            text-align: center; 
            padding: 40px; 
            color: #888; 
        }
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #00bcd4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Main Player Area */
        #main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: #000; 
            position: relative;
        }
        
        .video-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            position: relative;
        }
        
        video { 
            width: 100%; 
            height: auto;
            max-height: 70vh;
            background: #000; 
            outline: none; 
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        #status { 
            margin-top: 15px; 
            color: #aaa; 
            font-size: 14px; 
            text-align: center;
            padding: 10px 20px;
            background: #1a1a1a;
            border-radius: 20px;
            min-width: 300px;
        }
        #status.error { color: #ff5252; background: rgba(255,82,82,0.1); }
        #status.success { color: #69f0ae; background: rgba(105,240,174,0.1); }
        
        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 50vh; border-right: none; border-bottom: 1px solid #333; }
            #main { height: 50vh; }
        }
        
        /* Empty state */
        .empty-state { text-align: center; padding: 40px; color: #666; }
        
        /* CORS Warning */
        .cors-warning {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff5252;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 350px;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 15px rgba(255,82,82,0.3);
        }
        .cors-warning.show { display: block; }
        .cors-warning h4 { margin-bottom: 8px; }
        .cors-warning p { font-size: 13px; line-height: 1.5; }
        .cors-warning button {
            margin-top: 10px;
            padding: 6px 12px;
            background: white;
            color: #ff5252;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">📺 ZAMAN IPTV</div>
        <div class="controls">
            <select id="groupSelect" onchange="filterChannels()">
                <option value="ALL">هەموو گرووپەکان</option>
            </select>
            <input type="text" id="searchInput" placeholder="گەڕان بۆ کەناڵ..." oninput="searchChannels()">
        </div>
        <div class="stats">
            <span id="totalChannels">کەناڵ: 0</span>
            <span id="currentGroup">هەموو</span>
        </div>
        <ul id="channelList">
            <div class="loading">
                <div class="spinner"></div>
                <div>بارکردنی کەناڵەکان...</div>
            </div>
        </ul>
    </div>

    <div id="main">
        <div class="video-container">
            <video id="videoPlayer" controls autoplay playsinline></video>
            <div id="status">کەناڵێک هەڵبژێرە بۆ لێدان...</div>
        </div>
    </div>

    <div class="cors-warning" id="corsWarning">
        <h4>⚠️ کێشەی CORS</h4>
        <p>براوسەر ڕێگا نادات بە ڕاستەوخۆ پەیوەندی بە سێرڤەری دەرەوە. تکایە یەکێک لەم چارەسەرانە بەکاربهێنە:</p>
        <p>1. فایلەکە لە Local Server (XAMPP/Live Server) بەکاربهێنە</p>
        <p>2. Extensionی CORS Unblock دابمەزرێنە</p>
        <button onclick="document.getElementById('corsWarning').classList.remove('show')">باشە</button>
    </div>

    <script>
        // ⚠️ لینکی M3U - دەتوانی ئەمە بگۆڕیت
        const M3U_URL = "https://xtream-ie.net/get.php?username=serverblbas&password=serverblbas&type=m3u_plus";
        
        let allChannels = [];
        let hls = null;
        let currentPlayingUrl = null;

        // دەستپێکردن
        init();

        async function init() {
            try {
                updateStatus("پەیوەندیکردن بە سێرڤەر...", "normal");
                
                // هەوڵدان بۆ وەرگرتنی داتا
                const response = await fetch(M3U_URL, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Accept': 'application/vnd.apple.mpegurl, audio/mpegurl, application/x-mpegURL, */*'
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.text();
                parseM3U(data);
                updateStatus(`✅ ${allChannels.length} کەناڵ بارکرا`, "success");
                
            } catch (err) {
                console.error("Error:", err);
                showCorsError();
                updateStatus("❌ کێشە لە بارکردن: " + err.message, "error");
                
                // نموونەی داتا بۆ تاقیکردنەوە (لە کاتی شکستی فETCH)
                loadDemoData();
            }
        }

        function showCorsError() {
            document.getElementById('corsWarning').classList.add('show');
            document.getElementById('channelList').innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 40px; margin-bottom: 10px;">📡</div>
                    <div>نەتوانرا پەیوەندی بکرێت</div>
                    <div style="font-size: 12px; margin-top: 10px; color: #666;">
                        تکایە بزانە:<br>
                        1. لینکی M3U دروستە؟<br>
                        2. سێرڤەرەکە کار دەکات؟<br>
                        3. CORS چاککراوە؟
                    </div>
                </div>
            `;
        }

        // شیکردنەوەی M3U
        function parseM3U(data) {
            const lines = data.split('\n');
            let currentChannel = {};
            const groups = new Set(['ALL']);

            lines.forEach((line, index) => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    // گرووپ
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const group = groupMatch && groupMatch[1] ? groupMatch[1] : 'Unknown';
                    groups.add(group);

                    // لۆگۆ
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch && logoMatch[1] ? logoMatch[1] : '';

                    // ناسنامە (tvg-id)
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const tvgId = idMatch && idMatch[1] ? idMatch[1] : '';

                    // ناو
                    const commaIndex = line.lastIndexOf(',');
                    const name = commaIndex > -1 ? line.substring(commaIndex + 1).trim() : 'Unknown Channel';

                    currentChannel = { name, group, logo, tvgId, lineNum: index };
                } else if (line.startsWith('http') && currentChannel.name) {
                    currentChannel.url = line;
                    allChannels.push({...currentChannel});
                    currentChannel = {};
                }
            });

            // پڕکردنەوەی گرووپەکان
            const select = document.getElementById('groupSelect');
            select.innerHTML = '<option value="ALL">هەموو گرووپەکان</option>';
            
            Array.from(groups).sort().forEach(g => {
                if (g !== 'ALL') {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.innerText = g;
                    select.appendChild(opt);
                }
            });

            updateStats();
            renderChannels(allChannels);
        }

        // نیشاندانی کەناڵەکان
        function renderChannels(channels) {
            const list = document.getElementById('channelList');
            list.innerHTML = '';

            if (channels.length === 0) {
                list.innerHTML = '<div class="empty-state">هیچ کەناڵێک نەدۆزرایەوە</div>';
                return;
            }

            channels.forEach((ch, index) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                li.dataset.url = ch.url;
                
                const img = document.createElement('img');
                img.src = ch.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="45" height="45"><rect width="45" height="45" fill="%23333"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="%23666" font-size="20">📺</text></svg>';
                img.alt = ch.name;
                img.onerror = function() {
                    this.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="45" height="45"><rect width="45" height="45" fill="%23222"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="%23555" font-size="12">TV</text></svg>';
                };

                const info = document.createElement('div');
                info.className = 'channel-info';
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'channel-name';
                nameSpan.innerText = ch.name;
                
                const groupSpan = document.createElement('span');
                groupSpan.className = 'channel-group';
                groupSpan.innerText = ch.group;
                
                info.appendChild(nameSpan);
                info.appendChild(groupSpan);
                
                li.appendChild(img);
                li.appendChild(info);

                li.onclick = () => playStream(ch.url, ch.name, li);
                list.appendChild(li);
            });
        }

        // فلتەرکردن بەپێی گرووپ
        function filterChannels() {
            const selectedGroup = document.getElementById('groupSelect').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allChannels;
            
            if (selectedGroup !== 'ALL') {
                filtered = filtered.filter(c => c.group === selectedGroup);
            }
            
            if (searchTerm) {
                filtered = filtered.filter(c => c.name.toLowerCase().includes(searchTerm));
            }
            
            renderChannels(filtered);
            updateStats(filtered.length, selectedGroup);
        }

        // گەڕان
        function searchChannels() {
            filterChannels();
        }

        // لێدانی کەناڵ
        function playStream(url, name, element) {
            if (!url) return;
            
            // نیشاندانی چالاک
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            
            const video = document.getElementById('videoPlayer');
            currentPlayingUrl = url;
            
            updateStatus("⏳ بەرزکردنەوەی " + name + "...", "normal");

            // پچڕانی HLSی کۆن
            if (hls) {
                hls.destroy();
                hls = null;
            }

            // هەڵبژاردنی شێوازی لێدان
            if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('type=m3u'))) {
                // HLS Stream
                hls = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                    updateStatus("▶️ پەخشکردن: " + name, "success");
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                updateStatus("❌ کێشەی نێتۆڕک", "error");
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                updateStatus("❌ کێشەی میدیا", "error");
                                hls.recoverMediaError();
                                break;
                            default:
                                updateStatus("❌ کێشە لە لێدان", "error");
                                hls.destroy();
                        }
                    }
                });
                
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS (Safari)
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                    updateStatus("▶️ پەخشکردن: " + name, "success");
                });
            } else {
                // MP4/RTMP/ئەوانە
                video.src = url;
                video.play().catch(err => {
                    updateStatus("❌ ناتوانرێت بپەخرێت: " + err.message, "error");
                });
                updateStatus("▶️ پەخشکردن: " + name, "success");
            }
        }

        // نوێکردنەوەی دەربارە
        function updateStatus(text, type) {
            const status = document.getElementById('status');
            status.innerText = text;
            status.className = '';
            if (type === 'error') status.classList.add('error');
            if (type === 'success') status.classList.add('success');
        }

        function updateStats(count, group) {
            const total = count !== undefined ? count : allChannels.length;
            const grp = group && group !== 'ALL' ? group : 'هەموو';
            document.getElementById('totalChannels').innerText = `کەناڵ: ${total}`;
            document.getElementById('currentGroup').innerText = grp;
        }

        // داتای نموونەیی بۆ تاقیکردنەوە
        function loadDemoData() {
            const demoData = `#EXTM3U
#EXTINF:-1 tvg-logo="https://via.placeholder.com/40" group-title="News",BBC World News
https://example.com/bbc.m3u8
#EXTINF:-1 tvg-logo="https://via.placeholder.com/40" group-title="Sports",ESPN
https://example.com/espn.m3u8
#EXTINF:-1 tvg-logo="https://via.placeholder.com/40" group-title="Movies",HBO
https://example.com/hbo.m3u8`;
            
            parseM3U(demoData);
            updateStatus("⚠️ داتای نموونەیی نیشان درا (سێرڤەر بەردەست نییە)", "error");
        }

        // کیبۆرد شۆرتکات
        document.addEventListener('keydown', (e) => {
            const video = document.getElementById('videoPlayer');
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                if (video.paused) video.play(); else video.pause();
            }
            if (e.code === 'KeyF') {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    video.requestFullscreen();
                }
            }
        });
    </script>
</body>
</html>
